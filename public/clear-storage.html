<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>清理梦境存储</title>
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
        }
        button {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Noto Serif SC', serif;
            transition: all 0.3s;
        }
        button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        #info {
            margin: 20px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            text-align: left;
            font-size: 14px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 梦境存储管理</h1>
        <div id="info">
            <p>📊 正在检查存储状态...</p>
        </div>
        <button onclick="checkStorage()">检查存储</button>
        <button onclick="clearStorage()">清空所有梦境</button>
        <button onclick="window.location.href='http://localhost:3000'">返回应用</button>
    </div>

    <script>
        const STORAGE_KEY = 'dream3_user_dreams';

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function checkStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                const info = document.getElementById('info');

                if (!data) {
                    info.innerHTML = `
                        <p>✅ localStorage 是空的</p>
                        <p>📦 可以开始创建新梦境了！</p>
                    `;
                    return;
                }

                const dreams = JSON.parse(data);
                const dataSize = new Blob([data]).size;

                info.innerHTML = `
                    <p>📊 当前状态：</p>
                    <p>🔢 梦境数量：${dreams.length} 个</p>
                    <p>💾 占用空间：${formatBytes(dataSize)}</p>
                    <p>⚠️ localStorage 限制：约 5-10 MB</p>
                    <hr style="border-color: rgba(255,255,255,0.2); margin: 15px 0;">
                    <p>📋 梦境列表：</p>
                    ${dreams.map((d, i) => `
                        <p style="margin: 5px 0;">
                            ${i + 1}. ${d.inputText?.substring(0, 20) || '无题'}
                            (${d.isAIGenerated ? 'AI图' : '预设图'})
                            <br>
                            <small style="opacity: 0.6;">
                                图片大小：${d.imageUrl ? formatBytes(d.imageUrl.length) : '未知'}
                            </small>
                        </p>
                    `).join('')}
                `;
            } catch (error) {
                document.getElementById('info').innerHTML = `
                    <p>❌ 读取失败：${error.message}</p>
                `;
            }
        }

        function clearStorage() {
            if (confirm('确定要清空所有梦境吗？此操作不可恢复！')) {
                localStorage.removeItem(STORAGE_KEY);
                document.getElementById('info').innerHTML = `
                    <p>✅ 所有梦境已清空！</p>
                    <p>🎨 现在可以返回应用创建新梦境了</p>
                `;
            }
        }

        // 页面加载时自动检查
        window.onload = checkStorage;
    </script>
</body>
</html>
