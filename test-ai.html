<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 梦境生成测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            margin-bottom: 10px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .result.active {
            display: block;
        }

        .result h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .keywords {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .keyword {
            padding: 5px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 14px;
        }

        .dream-image {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .description {
            color: #555;
            line-height: 1.6;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 10px;
            color: #c33;
        }

        .error.active {
            display: block;
        }

        .note {
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 5px;
            font-size: 14px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 AI 梦境生成测试</h1>
        <p class="subtitle">基于 Gemini AI + Supabase Edge Functions</p>

        <div class="input-group">
            <label for="dreamInput">输入你的梦境内容：</label>
            <textarea
                id="dreamInput"
                placeholder="描述你的梦境...例如：我在一片星空下漂浮，周围是闪烁的星辰..."
            ></textarea>
        </div>

        <button id="generateBtn">✨ 生成梦境图片</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI 正在编织你的梦境...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <h3>生成结果：</h3>
            <div class="keywords" id="keywords"></div>
            <img class="dream-image" id="dreamImage" alt="梦境图片">
            <p class="description" id="description"></p>
            <div class="note" id="note" style="display: none;"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pcolyjkqfznorelcxkvb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjb2x5amtxZnpub3JlbGN4a3ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU2ODg4OTAsImV4cCI6MjA4MTI2NDg5MH0.drUwcasIa0tN1p7niQxypUKZt6BgsXHr3RXKWzv_svs";

        const dreamInput = document.getElementById('dreamInput');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const result = document.getElementById('result');
        const keywords = document.getElementById('keywords');
        const dreamImage = document.getElementById('dreamImage');
        const description = document.getElementById('description');
        const note = document.getElementById('note');

        generateBtn.addEventListener('click', async () => {
            const inputText = dreamInput.value.trim();

            if (!inputText) {
                showError('请输入梦境内容！');
                return;
            }

            // 重置状态
            error.classList.remove('active');
            result.classList.remove('active');
            loading.classList.add('active');
            generateBtn.disabled = true;

            try {
                console.log('🌙 开始调用 Edge Function...');

                const response = await fetch(
                    `${SUPABASE_URL}/functions/v1/generate-dream`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        },
                        body: JSON.stringify({ inputText }),
                    }
                );

                console.log('📡 响应状态:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Edge Function 错误:', errorText);
                    throw new Error(`生成失败 (${response.status}): ${errorText}`);
                }

                const data = await response.json();
                console.log('✨ 生成成功:', data);

                // 显示结果
                displayResult(data);

            } catch (err) {
                console.error('❌ 错误:', err);
                showError(err.message);
            } finally {
                loading.classList.remove('active');
                generateBtn.disabled = false;
            }
        });

        function displayResult(data) {
            // 显示关键词
            keywords.innerHTML = '';
            data.keywords.forEach(keyword => {
                const span = document.createElement('span');
                span.className = 'keyword';
                span.textContent = keyword;
                keywords.appendChild(span);
            });

            // 显示图片
            dreamImage.src = data.imageUrl;
            dreamImage.onerror = () => {
                showError('图片加载失败，请重试');
            };

            // 显示描述
            description.textContent = data.description;

            // 显示备注（如果有）
            if (data.note) {
                note.textContent = data.note;
                note.style.display = 'block';
            } else {
                note.style.display = 'none';
            }

            result.classList.add('active');
        }

        function showError(message) {
            error.textContent = '❌ ' + message;
            error.classList.add('active');
        }
    </script>
</body>
</html>
